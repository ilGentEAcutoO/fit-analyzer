<style>/* ============================================================
   BIRCHLINE  -  design system for workflow HTML artifacts
   Warm editorial. Serif display, mono labels, sans body.
   Self-contained, light only, offline-safe font stacks.
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* surfaces */
  --paper:#F4F1E8; --paper-2:#EDE9DC; --card:#FFFFFF; --card-2:#FBF9F2;
  --chrome:#E9E4D6; --line:#E2DCCC; --line-2:#D4CCB8;
  /* ink */
  --ink:#1B1A17; --ink-2:#55514A; --ink-3:#8B8678; --ink-4:#A8A395;
  /* birchline palette */
  --clay:#C8623E; --clay-soft:#F2E0D6; --clay-line:#E0A98E;
  --olive:#6F864F; --olive-soft:#E4E8D8; --olive-line:#AEBE8E;
  --sky:#5E80A6; --sky-soft:#DCE4ED;
  --gold:#B98828; --gold-soft:#F1E6CC;
  --red:#B4452F; --red-soft:#F2DDD7;
  --oat:#E3DACC;
  /* code panel */
  --dark:#1F1E1B; --dark-2:#2A2925; --dark-ink:#E9E5DA; --dark-dim:#8D887B;
  /* type */
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Hoefler Text',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  --r:14px; --r-s:9px;
  --shadow:0 1px 2px rgba(31,30,27,.05),0 10px 30px -12px rgba(31,30,27,.16);
  --shadow-s:0 1px 2px rgba(31,30,27,.06),0 4px 12px -6px rgba(31,30,27,.12);
  color-scheme:light;
}
html,body{background:var(--paper)}
body{font-family:var(--sans);color:var(--ink);line-height:1.62;font-size:15px;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

/* ---- type helpers ---- */
.kicker{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3)}
.display{font-family:var(--serif);font-weight:600;letter-spacing:-.015em;line-height:1.12;
  font-size:clamp(28px,4.4vw,42px)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.2}
h2{font-size:23px} h3{font-size:18px}
.lead{font-size:17px;color:var(--ink-2);line-height:1.6}
.mono{font-family:var(--mono)}
a{color:var(--clay);text-decoration:none;border-bottom:1px solid var(--clay-line)}
code{font-family:var(--mono);font-size:.9em;background:var(--paper-2);
  padding:.1em .38em;border-radius:5px;color:var(--ink)}

/* ---- window chrome (browser-frame wrapper) ---- */
.window{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.window>.bar{background:var(--chrome);border-bottom:1px solid var(--line);
  padding:13px 16px;display:flex;align-items:center;gap:8px;position:relative}
.window>.bar .dots{display:flex;gap:7px}
.window>.bar .dots i{width:11px;height:11px;border-radius:50%;background:#CFC8B6;display:block}
.window>.bar .title{position:absolute;left:0;right:0;text-align:center;
  font-family:var(--mono);font-size:12.5px;color:var(--ink-3);pointer-events:none}
.window>.body{padding:26px 28px}

/* ---- generic card ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 22px;box-shadow:var(--shadow-s)}

/* ---- pills / tags / badges ---- */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);
  font-size:11px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:20px;
  border:1px solid transparent;text-transform:uppercase}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.pill.todo{background:var(--paper-2);color:var(--ink-3)}
.pill.doing{background:var(--sky-soft);color:var(--sky)}
.pill.impl{background:var(--gold-soft);color:var(--gold)}
.pill.done{background:var(--olive-soft);color:var(--olive)}
.pill.block{background:var(--red-soft);color:var(--red)}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--ink-2);
  background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.badge{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:2px 7px;border-radius:5px}
.badge.hi{background:var(--clay-soft);color:var(--clay)}
.badge.mid{background:var(--gold-soft);color:var(--gold)}
.badge.lo{background:var(--paper-2);color:var(--ink-3)}

/* ---- toggle switch ---- */
.tg{appearance:none;cursor:pointer;width:42px;height:24px;border-radius:14px;
  background:var(--line-2);position:relative;transition:background .18s;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;
  border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .18s}
.tg:checked{background:var(--olive)}
.tg:checked::after{left:21px}
.tg.warn:checked{background:var(--clay)}

/* ---- buttons ---- */
.btn{font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;
  padding:9px 18px;border-radius:var(--r-s);border:1px solid transparent;transition:.15s}
.btn.primary{background:var(--clay);color:#fff}
.btn.primary:hover{background:#b5552f}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--card-2)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.block{display:block;width:100%;text-align:center}

/* ---- sliders ---- */
.range{appearance:none;width:100%;height:5px;border-radius:3px;background:var(--oat);outline:none}
.range::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--ink);cursor:pointer;border:3px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.range::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);
  cursor:pointer;border:3px solid var(--card)}

/* ---- stat callout ---- */
.stat{background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-s);
  padding:16px 18px}
.stat .n{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1;letter-spacing:-.02em}
.stat .l{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:8px}
.stat.good .n{color:var(--olive)} .stat.bad .n{color:var(--red)} .stat.key .n{color:var(--clay)}

/* ---- callout note ---- */
.note{border-radius:var(--r-s);padding:13px 15px;font-size:14px;border:1px solid;
  display:flex;gap:10px}
.note .ic{font-family:var(--mono);font-weight:700;flex:none}
.note.info{background:var(--sky-soft);border-color:#C3D0DE;color:#3f5a76}
.note.ok{background:var(--olive-soft);border-color:var(--olive-line);color:#4d5f37}
.note.warn{background:var(--clay-soft);border-color:var(--clay-line);color:#9a4a2c}
.note.danger{background:var(--red-soft);border-color:#DDB3A8;color:#8d3322}

/* ---- code panels ---- */
.code{background:var(--dark);border-radius:var(--r-s);overflow:hidden;
  font-family:var(--mono);font-size:12.5px;line-height:1.7}
.code .top{background:var(--dark-2);padding:8px 14px;display:flex;justify-content:space-between;
  color:var(--dark-dim);font-size:11.5px;border-bottom:1px solid #000}
.code pre{padding:14px 16px;color:var(--dark-ink);overflow-x:auto}
.code .c{color:var(--dark-dim)} .code .k{color:#D9A05B} .code .s{color:#9BB06E}
.code .add{color:#9BB06E} .code .del{color:#D98A6E}

/* ---- diff rows ---- */
.diff{font-family:var(--mono);font-size:12.5px;line-height:1.75}
.diff .row{padding:1px 10px;white-space:pre-wrap}
.diff .row.add{background:var(--olive-soft);color:#4d5f37}
.diff .row.del{background:var(--red-soft);color:#8d3322}

/* ---- collapsible steps (<details>) ---- */
.step{border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:8px;
  background:var(--card);overflow:hidden}
.step[open]{border-color:var(--clay-line);box-shadow:0 0 0 3px var(--clay-soft)}
.step>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;
  align-items:center;gap:11px;font-family:var(--serif);font-size:17px;font-weight:600}
.step>summary::-webkit-details-marker{display:none}
.step>summary .ar{font-family:var(--mono);color:var(--clay);font-size:12px;transition:transform .15s}
.step[open]>summary .ar{transform:rotate(90deg)}
.step>summary .num{font-family:var(--mono);font-size:13px;color:var(--ink-3);font-weight:600}
.step>summary .loc{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-4);font-weight:400}
.step .inner{padding:2px 16px 16px 41px;color:var(--ink-2);font-size:14px}

/* plain collapsible (details) for "boring detail" */
.fold{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.fold>summary{list-style:none;cursor:pointer;font-family:var(--mono);font-size:11.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"+ ";color:var(--clay)}
.fold[open]>summary::before{content:"- "}
.fold .inner{padding-top:10px;font-size:13.5px;color:var(--ink-2)}

/* ---- tabs ---- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{font-family:var(--mono);font-size:12.5px;cursor:pointer;background:none;
  border:none;padding:8px 13px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--clay);font-weight:600}
.tabpane{display:none} .tabpane.on{display:block}

/* ---- TOC sidebar + scroll-spy ---- */
.toc{position:sticky;top:20px;font-family:var(--mono);font-size:13px;border-left:2px solid var(--line)}
.toc a{display:block;padding:4px 0 4px 14px;color:var(--ink-3);border:none;
  margin-left:-2px;border-left:2px solid transparent}
.toc a.on{color:var(--ink);border-left-color:var(--clay);font-weight:600}
.toc a.sub{padding-left:28px;font-size:12px}

/* ---- approach / comparison grid ---- */
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.approach{background:var(--card-2);border:1.5px solid var(--line);border-radius:var(--r);
  padding:18px;cursor:pointer;transition:.16s}
.approach:hover{border-color:var(--line-2);transform:translateY(-2px)}
.approach.pick{border-color:var(--clay);background:var(--card);
  box-shadow:0 0 0 4px var(--clay-soft),var(--shadow-s)}
.approach .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.approach .hd .id{font-family:var(--mono);font-size:13px;color:var(--ink-4)}
.approach .pro{color:var(--olive);font-family:var(--mono);font-size:12.5px}
.approach .con{color:var(--red);font-family:var(--mono);font-size:12.5px}

/* ---- task board ---- */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.col-h{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);padding:0 2px 8px;display:flex;justify-content:space-between}
.tk{background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);
  padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow-s)}
.tk .tkn{font-weight:600;font-size:14px;margin:5px 0 7px}
.tk .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---- progress ring / bar ---- */
.bar-track{height:7px;background:var(--oat);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--olive);border-radius:4px}

/* ---- swatches ---- */
.sw{border-radius:10px;height:74px;border:1px solid rgba(0,0,0,.06)}
.sw-l{font-family:var(--mono);font-size:11.5px;margin-top:6px;color:var(--ink-2)}
.sw-h{font-family:var(--mono);font-size:11px;color:var(--ink-4)}

/* ---- table ---- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line-2)}
td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--ink-2)}
tr:last-child td{border-bottom:none}

/* ---- annotation card (code review) ---- */
.annot{border:1.5px solid var(--line-2);border-radius:var(--r-s);padding:12px 14px;background:var(--card)}
.annot.blocking{border-color:var(--clay);background:var(--clay-soft)}
.annot.nit{border-color:var(--line-2)}
.annot.nice{border-color:var(--olive-line);background:var(--olive-soft)}
.annot .lbl{font-family:var(--mono);font-size:12px;font-weight:700;margin-bottom:5px}
.annot.blocking .lbl{color:var(--clay)} .annot.nice .lbl{color:var(--olive)}
.annot.nit .lbl{color:var(--ink-3)}

/* ---- misc layout ---- */
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--ink-3)} .small{font-size:13px}
hr{border:none;border-top:1px solid var(--line);margin:18px 0}
.divider{height:1px;background:var(--line);margin:16px 0}

@media(max-width:720px){
  .grid-3,.grid-2,.board{grid-template-columns:1fr}
  .window>.body{padding:18px 16px}
}
@media print{
  body{background:#fff}
  .window{box-shadow:none;break-inside:avoid}
  .toc,.tabs{display:none}
}

.page{max-width:1000px;margin:0 auto;padding:30px 22px 70px}
.resume-banner{background:var(--clay-soft);border:1px solid var(--clay-line);
  border-radius:var(--r);padding:16px 18px;margin-bottom:22px}
.empty{text-align:center;padding:60px 20px;color:var(--ink-3)}
</style>

<script>
/* todos.html renderer — rebuilds the board from the JSON island.
   Agents must NEVER hand-edit the markup below; edit the JSON above. */
(function(){
  var S;
  try { S = JSON.parse(document.getElementById('workflow-state').textContent); }
  catch(e){ document.getElementById('app').innerHTML =
    '<div class="note danger"><span class="ic">!</span><div>State JSON is invalid: '
    +e.message+'</div></div>'; return; }

  var COLS = [
    {key:'todo',   label:'To do',       has:function(s){return s==='pending';}},
    {key:'doing',  label:'In progress', has:function(s){return s==='progress'||s==='impl'||s==='blocked';}},
    {key:'done',   label:'Done',        has:function(s){return s==='done';}}
  ];
  var PILL = {pending:['todo','pending'],progress:['doing','in&nbsp;progress'],
    impl:['impl','implemented'],done:['done','tested'],blocked:['block','blocked']};
  var BADGE = {high:['hi','high'],medium:['mid','med'],low:['lo','low']};

  function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

  function card(t){
    var p = PILL[t.status]||PILL.pending;
    var b = t.priority?BADGE[t.priority]:null;
    var h = '<div class="tk"'+(t.status==='blocked'
        ?' style="border-color:#DDB3A8;box-shadow:0 0 0 3px var(--red-soft)"'
        :t.status==='progress'
        ?' style="border-color:var(--clay-line);box-shadow:0 0 0 3px var(--clay-soft)"':'')+'>';
    h += '<div class="row"><span class="pill '+p[0]+'">'+p[1]+'</span>';
    if(b) h += '<span class="badge '+b[0]+'">'+b[1]+'</span>';
    h += '<span class="mono small muted" style="margin-left:auto">'+esc(t.id)+'</span></div>';
    h += '<div class="tkn">'+esc(t.name)+'</div>';
    var meta = [];
    (t.files||[]).forEach(function(f){meta.push('<span class="tag">'+esc(f)+'</span>');});
    (t.skills||[]).forEach(function(s){meta.push('<span class="tag" style="color:var(--sky)">'+esc(s)+'</span>');});
    if(t.assigned && t.assigned!=='unassigned')
      meta.push('<span class="tag" style="color:var(--clay)">'+esc(t.assigned)+'</span>');
    if(meta.length) h += '<div class="meta">'+meta.join('')+'</div>';
    if(typeof t.progress==='number' && t.status!=='done')
      h += '<div class="bar-track" style="margin-top:9px"><div class="bar-fill" style="width:'
        +Math.max(0,Math.min(100,t.progress))+'%"></div></div>';
    if(t.note) h += '<div class="small muted" style="margin-top:8px">'+esc(t.note)+'</div>';
    return h+'</div>';
  }

  var tasks = S.tasks||[];
  var doneN = tasks.filter(function(t){return t.status==='done';}).length;
  var pct = tasks.length? Math.round(doneN/tasks.length*100):0;
  var C = 2*Math.PI*19, off = C*(1-pct/100);

  var html = '';

  if(S.resume){
    var r = S.resume;
    html += '<div class="resume-banner"><div class="kicker" style="color:var(--clay);'
      +'margin-bottom:6px">Session paused — resume context</div>'
      +'<strong>'+esc(r.reason||'saved')+'</strong>'
      +'<span class="small muted"> · '+esc(r.exitTime||'')+'</span>';
    if(r.agents&&r.agents.length){
      html += '<div style="margin-top:10px;display:grid;gap:6px">';
      r.agents.forEach(function(a){
        html += '<div class="small"><strong>'+esc(a.name)+'</strong> — '+esc(a.task||'')
          +' · next: '+esc(a.nextStep||'')+'</div>';
      });
      html += '</div>';
    }
    html += '</div>';
  }

  html += '<div class="between" style="margin-bottom:18px">'
    +'<div><div class="kicker">Session</div>'
    +'<h2 style="font-size:21px">'+esc(S.session)+'</h2></div>'
    +'<div class="row" style="gap:16px">'
    +'<div style="text-align:right"><div class="kicker">Updated</div>'
    +'<strong class="mono small">'+esc(S.updated)+'</strong></div>'
    +'<svg width="46" height="46" viewBox="0 0 46 46">'
    +'<circle cx="23" cy="23" r="19" fill="none" stroke="#E3DACC" stroke-width="6"/>'
    +'<circle cx="23" cy="23" r="19" fill="none" stroke="#6F864F" stroke-width="6" '
    +'stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" '
    +'stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 23 23)"/>'
    +'<text x="23" y="27" text-anchor="middle" font-family="var(--mono)" '
    +'font-size="11" font-weight="700" fill="#1B1A17">'+pct+'</text></svg></div></div>';

  if(!tasks.length){
    html += '<div class="window"><div class="bar"><span class="dots"><i></i><i></i><i></i></span>'
      +'<span class="title">todos.html</span></div>'
      +'<div class="empty">No tasks yet. <code>workflow-plan</code> will populate the board.</div></div>';
  } else {
    html += '<div class="board">';
    COLS.forEach(function(col){
      var items = tasks.filter(function(t){return col.has(t.status);});
      html += '<div><div class="col-h"><span>'+col.label+'</span><span>'+items.length+'</span></div>';
      html += items.map(card).join('') ||
        '<div class="small muted" style="padding:8px 2px">—</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  if((S.fileLocks||[]).length){
    html += '<details class="fold"><summary>File locks ('+S.fileLocks.length+')</summary>'
      +'<div class="inner"><table><thead><tr><th>File</th><th>Held by</th><th>Since</th></tr></thead><tbody>';
    S.fileLocks.forEach(function(l){
      html += '<tr><td><code>'+esc(l.file)+'</code></td><td>'+esc(l.by)+'</td>'
        +'<td class="mono">'+esc(l.since)+'</td></tr>';
    });
    html += '</tbody></table></div></details>';
  }

  document.getElementById('app').innerHTML = html;
})();
</script>
